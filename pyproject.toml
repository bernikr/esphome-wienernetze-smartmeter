[project]
name = "esphome-wienernetze-smartmeter"
version = "1.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "D",   # pydocstyle
  "CPY", # flake8-copyright
  "T20", # flake8-print
]

[dependency-groups]
dev = [
  "ruff>=0.16.10",
  "esphome>=2026.9.1",
  "gitpython>=3.2.0",
  "semver>=3.1.0",
  "prek>=0.5.4",
]
