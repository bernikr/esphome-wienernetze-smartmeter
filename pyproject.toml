[project]
name = "esphome-wienernetze-smartmeter"
version = "2.1.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "D",   # pydocstyle
  "CPY", # flake8-copyright
  "T20", # flake8-print
]

[dependency-groups]
dev = [
  "ruff>=0.17.6",
  "esphome>=2026.11.1",
  "prek>=0.5.11",
]
