[project]
name = "esphome-wienernetze-smartmeter"
version = "1.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "D",   # pydocstyle
  "CPY", # flake8-copyright
  "T20", # flake8-print
]

[dependency-groups]
dev = [
  "ruff>=0.15.20",
  "esphome>=2026.6.3",
  "gitpython>=3.1.57",
  "semver>=3.0.4",
  "prek>=0.4.5",
]
